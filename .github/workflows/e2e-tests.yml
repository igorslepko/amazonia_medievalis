name: E2E Tests
on:
  push:
    branches: [ts]
    paths:
      - 'e2e/**'
      - 'frontend/**'
      - '.github/workflows/e2e-tests.yml'
  pull_request:
    branches: [ts]
    paths:
      - 'e2e/**'
      - 'frontend/**'
      - '.github/workflows/e2e-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          cd e2e
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
        env:
          CI: true
